<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes drawLine {
      from { stroke-dashoffset: 1; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .start-dot {
      animation: scaleIn 0.8s ease-out forwards;
      transform-origin: center;
    }

    .draw-rect {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawLine 1.5s ease-out forwards;
    }

    .rect-1 { animation-delay: 0.2s; }
    .rect-2 { animation-delay: 0.4s; }
    .rect-3 { animation-delay: 0.6s; }
    .rect-4 { animation-delay: 0.8s; }
    .rect-5 { animation-delay: 1s; }
    .rect-6 { animation-delay: 1.2s; }
    .rect-7 { animation-delay: 1.4s; }
    .rect-8 { animation-delay: 1.6s; }

    .draw-circle {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawLine 1s ease-out forwards;
    }

    .fib-1 { animation-delay: 0.3s; }
    .fib-2 { animation-delay: 0.5s; }
    .fib-3 { animation-delay: 0.7s; }
    .fib-4 { animation-delay: 0.9s; }
    .fib-5 { animation-delay: 1.1s; }
    .fib-6 { animation-delay: 1.3s; }
    .fib-7 { animation-delay: 1.5s; }
    .fib-8 { animation-delay: 1.7s; }
    .fib-9 { animation-delay: 1.9s; }

    .draw-line {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawLine 1.2s ease-out forwards;
    }

    .draw-point {
      animation: scaleIn 0.6s ease-out forwards;
      transform-origin: center;
    }

    .thirds-grid .draw-line:nth-child(1) { animation-delay: 0.5s; }
    .thirds-grid .draw-line:nth-child(2) { animation-delay: 0.6s; }
    .thirds-grid .draw-line:nth-child(3) { animation-delay: 0.7s; }
    .thirds-grid .draw-line:nth-child(4) { animation-delay: 0.8s; }
    .thirds-grid .draw-point:nth-child(5) { animation-delay: 1.2s; }
    .thirds-grid .draw-point:nth-child(6) { animation-delay: 1.3s; }
    .thirds-grid .draw-point:nth-child(7) { animation-delay: 1.4s; }
    .thirds-grid .draw-point:nth-child(8) { animation-delay: 1.5s; }

    .type-grid .draw-line { animation-delay: 0.8s; }
    .swiss-grid { animation: fadeIn 2s ease-out forwards; opacity: 0; animation-delay: 0.3s; }
    .color-theory .draw-circle { animation-delay: 1s; }
    .color-theory .draw-line { animation-delay: 1.2s; }
  </style>

  <!-- Origin Dot - Right side away from typical content area -->
  <circle class="start-dot" cx="1200" cy="400" r="4" fill="#FF6B35"/>

  <!-- Golden Ratio Rectangles -->
  <g class="golden-rectangles">
    <rect class="draw-rect rect-1" x="1200" y="400" width="55" height="89" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <rect class="draw-rect rect-2" x="1255" y="400" width="89" height="89" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <rect class="draw-rect rect-3" x="1200" y="311" width="144" height="89" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <rect class="draw-rect rect-4" x="1056" y="311" width="144" height="144" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <rect class="draw-rect rect-5" x="1056" y="167" width="233" height="144" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <rect class="draw-rect rect-6" x="823" y="167" width="233" height="233" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <rect class="draw-rect rect-7" x="823" y="-66" width="377" height="233" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <rect class="draw-rect rect-8" x="446" y="-66" width="377" height="377" fill="none" stroke="#FF6B35" stroke-width="1"/>
  </g>

  <!-- Fibonacci Circles -->
  <g class="fibonacci-circles">
    <circle class="draw-circle fib-1" cx="1400" cy="200" r="3" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <circle class="draw-circle fib-2" cx="1400" cy="200" r="8" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle class="draw-circle fib-3" cx="1400" cy="200" r="21" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <circle class="draw-circle fib-4" cx="1400" cy="200" r="42" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle class="draw-circle fib-5" cx="1400" cy="200" r="76" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <circle class="draw-circle fib-6" cx="1400" cy="200" r="131" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle class="draw-circle fib-7" cx="1400" cy="200" r="220" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <circle class="draw-circle fib-8" cx="1400" cy="200" r="364" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle class="draw-circle fib-9" cx="1400" cy="200" r="598" fill="none" stroke="#FF6B35" stroke-width="1"/>
  </g>

  <!-- Rule of Thirds Grid -->
  <g class="thirds-grid">
    <line class="draw-line" x1="0" y1="360" x2="1920" y2="360" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line class="draw-line" x1="0" y1="720" x2="1920" y2="720" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line class="draw-line" x1="640" y1="0" x2="640" y2="1080" stroke="#FF6B35" stroke-width="1"/>
    <line class="draw-line" x1="1280" y1="0" x2="1280" y2="1080" stroke="#FF6B35" stroke-width="1"/>
    <circle class="draw-point" cx="640" cy="360" r="6" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <circle class="draw-point" cx="1280" cy="360" r="6" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <circle class="draw-point" cx="640" cy="720" r="6" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <circle class="draw-point" cx="1280" cy="720" r="6" fill="none" stroke="#FF6B35" stroke-width="1"/>
  </g>

  <!-- Typography Baseline Grid -->
  <g class="type-grid">
    <line class="draw-line" x1="60" y1="356" x2="1920" y2="356" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line class="draw-line" x1="60" y1="420" x2="1920" y2="420" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line class="draw-line" x1="60" y1="484" x2="1920" y2="484" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line class="draw-line" x1="60" y1="548" x2="1920" y2="548" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line class="draw-line" x1="60" y1="612" x2="1920" y2="612" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line class="draw-line" x1="60" y1="676" x2="1920" y2="676" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line class="draw-line" x1="60" y1="740" x2="1920" y2="740" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line class="draw-line" x1="60" y1="292" x2="1920" y2="292" stroke="#FF6B35" stroke-width="1"/>
    <line class="draw-line" x1="60" y1="804" x2="800" y2="804" stroke="#FF6B35" stroke-width="1"/>
    <line class="draw-line" x1="60" y1="868" x2="1200" y2="868" stroke="#FF6B35" stroke-width="1"/>
  </g>

  <!-- Swiss Modular Grid -->
  <g class="swiss-grid">
    <defs>
      <pattern id="swissGridPatternDark" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
        <rect width="60" height="60" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="1920" height="1080" fill="url(#swissGridPatternDark)"/>
    <line class="draw-line" x1="0" y1="180" x2="1920" y2="180" stroke="#FF6B35" stroke-width="1"/>
    <line class="draw-line" x1="300" y1="0" x2="300" y2="1080" stroke="#FF6B35" stroke-width="1"/>
  </g>

  <!-- Color Theory Circles -->
  <g class="color-theory">
    <circle class="draw-circle" cx="1400" cy="300" r="200" fill="none" stroke="#FF6B35" stroke-width="1"/>
    <circle class="draw-circle" cx="1400" cy="300" r="150" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line class="draw-line" x1="1400" y1="100" x2="1400" y2="500" stroke="#FF6B35" stroke-width="1"/>
    <line class="draw-line" x1="1200" y1="300" x2="1600" y2="300" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>
</svg>
